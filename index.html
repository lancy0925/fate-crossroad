<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d1017">
<title>命运的岔路口 · 大一四年互动故事</title>
<style>
  :root{
    --bg:#0d1017;
    --bg2:#131722;
    --card:#181e2c;
    --card2:#1c2231;
    --ink:#ece5d4;      /* 米白正文 */
    --ink-dim:#9c957f;
    --ink-faint:#6a6453;
    --gold:#d9a441;
    --gold-bright:#e8b95c;
    --line:#2a3142;
    --c-courage:#f0a35e; /* 勇气 暖橙 */
    --c-heart:#e08a9d;   /* 情感 玫瑰 */
    --c-study:#7fb3e8;   /* 学力 蓝 */
    --c-kind:#8fd0a6;    /* 善意 绿 */
    --serif:"Noto Serif SC","Songti SC","STZhongsong","STSong","SimSun",serif;
    --sans:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:var(--sans);
    color:var(--ink);
    background:var(--bg);
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }
  /* 星轨氛围背景 */
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(217,164,65,0.10), transparent 60%),
      radial-gradient(900px 500px at 100% 10%, rgba(127,179,232,0.07), transparent 60%),
      radial-gradient(700px 700px at 50% 120%, rgba(224,138,157,0.06), transparent 60%);
  }
  /* 星空点 */
  body::after{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
    background-image:
      radial-gradient(1px 1px at 20% 30%, rgba(236,229,212,.5), transparent),
      radial-gradient(1px 1px at 70% 60%, rgba(236,229,212,.4), transparent),
      radial-gradient(1.5px 1.5px at 40% 80%, rgba(236,229,212,.35), transparent),
      radial-gradient(1px 1px at 85% 20%, rgba(236,229,212,.45), transparent),
      radial-gradient(1px 1px at 10% 70%, rgba(236,229,212,.3), transparent),
      radial-gradient(1.5px 1.5px at 55% 10%, rgba(236,229,212,.35), transparent),
      radial-gradient(1px 1px at 90% 85%, rgba(236,229,212,.3), transparent);
  }
  .wrap{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:0 18px 60px;}

  /* 顶部进度 */
  .topbar{position:sticky;top:0;z-index:5;background:rgba(13,16,23,.88);backdrop-filter:blur(6px);padding:14px 0 10px;border-bottom:1px solid var(--line);}
  .toprow{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--ink-dim);letter-spacing:.5px;}
  .chapno{font-family:var(--serif);color:var(--gold);}
  .track{height:3px;background:var(--line);border-radius:2px;margin-top:10px;overflow:hidden;}
  .fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-bright));border-radius:2px;transition:width .5s ease;width:0;}

  /* 首页 */
  .home{min-height:82vh;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:40px 8px;}
  .home .seal{font-size:13px;letter-spacing:4px;color:var(--ink-dim);margin-bottom:18px;}
  .home h1{font-family:var(--serif);font-size:38px;font-weight:700;letter-spacing:6px;color:var(--ink);}
  .home h1 .gold{color:var(--gold);}
  .home .sub{margin-top:14px;font-size:14px;color:var(--ink-dim);line-height:1.9;letter-spacing:1px;}
  .home .rule{width:120px;height:1px;background:var(--gold);margin:26px auto;opacity:.6;}
  .home .tips{font-size:12px;color:var(--ink-faint);letter-spacing:1px;line-height:2;}

  /* 通用按钮 */
  .btn{
    display:inline-block;min-height:48px;padding:14px 26px;border:1px solid var(--line);
    border-radius:10px;background:var(--card);color:var(--ink);
    font-family:var(--sans);font-size:15px;cursor:pointer;text-align:center;
    transition:transform .15s ease,border-color .2s ease,background .2s ease,color .2s ease;
    -webkit-user-select:none;user-select:none;
  }
  .btn:hover{border-color:var(--gold);transform:translateY(-1px);}
  .btn:active{transform:translateY(0);}
  .btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold-bright));color:#17140c;border:none;font-weight:600;}
  .btn-gold:hover{border:none;filter:brightness(1.05);}
  .btn-ghost{background:transparent;color:var(--ink-dim);border-color:var(--line);}
  .btn-ghost:hover{color:var(--ink);}

  /* 章节视图 */
  .scene{animation:fadeUp .6s ease both;}
  .chapter{font-size:12px;letter-spacing:3px;color:var(--gold);margin-top:26px;}
  .scene h2{font-family:var(--serif);font-size:26px;font-weight:700;margin-top:8px;letter-spacing:1px;}
  .scene .escort{font-size:13px;color:var(--ink-dim);margin-top:8px;letter-spacing:1px;}
  .scene .story{
    margin-top:24px;font-size:15.5px;line-height:2.1;color:var(--ink);
    text-align:justify;text-justify:inter-ideograph;
  }
  .scene .story p{margin-bottom:16px;}

  .options{margin-top:28px;display:flex;flex-direction:column;gap:12px;}
  .opt{
    min-height:56px;padding:15px 18px;border:1px solid var(--line);border-radius:12px;
    background:var(--card);cursor:pointer;text-align:left;color:var(--ink);
    font-family:var(--sans);font-size:15px;transition:all .18s ease;position:relative;overflow:hidden;
  }
  .opt:hover{border-color:var(--gold);background:var(--card2);transform:translateY(-1px);}
  .opt:active{transform:translateY(0);}
  .opt .lab{font-weight:600;letter-spacing:.5px;}
  .opt .sub{display:block;font-size:12.5px;color:var(--ink-dim);margin-top:5px;}
  .opt.disabled{pointer-events:none;opacity:.45;}
  .opt.chosen{border-color:var(--gold);background:var(--card2);opacity:1;}
  .opt .tag{position:absolute;top:12px;right:14px;font-size:11px;color:var(--ink-faint);letter-spacing:1px;}

  /* 选择后命运旁白 */
  .fatebox{
    margin-top:24px;padding:22px;border-radius:14px;
    background:linear-gradient(135deg,rgba(217,164,65,.10),rgba(217,164,65,.02));
    border:1px solid rgba(217,164,65,.35);
    animation:fadeUp .5s ease both;
  }
  .fatebox .eyebrow{font-size:12px;letter-spacing:2px;color:var(--gold);}
  .fatebox .line{font-family:var(--serif);font-size:16px;line-height:2;color:var(--ink);margin-top:10px;}
  .fatebox .gain{margin-top:12px;font-size:12.5px;color:var(--ink-dim);letter-spacing:.5px;}
  .fatebox .gain b{font-weight:600;}
  .fatebox .next{margin-top:18px;}

  /* 命运值仪表 */
  .meter{
    margin-top:24px;padding:18px;border-radius:14px;background:var(--card);border:1px solid var(--line);
  }
  .meter .mtitle{font-size:12px;letter-spacing:2px;color:var(--ink-dim);margin-bottom:14px;}
  .met-row{display:flex;align-items:center;gap:12px;margin-bottom:11px;}
  .met-row:last-child{margin-bottom:0;}
  .met-name{width:44px;font-size:13px;color:var(--ink);font-weight:600;flex:none;}
  .met-bar{flex:1;height:8px;background:var(--line);border-radius:5px;overflow:hidden;}
  .met-fill{height:100%;width:0;border-radius:5px;transition:width .6s cubic-bezier(.4,0,.2,1);}
  .met-num{width:22px;text-align:right;font-size:12px;color:var(--ink-dim);flex:none;}

  /* 结果页 */
  .result{animation:fadeUp .6s ease both;text-align:center;padding-top:30px;}
  .result .badge{display:inline-block;font-size:12px;letter-spacing:3px;color:var(--gold);border:1px solid rgba(217,164,65,.4);border-radius:20px;padding:6px 16px;}
  .result .icon{font-size:52px;margin-top:22px;color:var(--gold);}
  .result h2{font-family:var(--serif);font-size:32px;font-weight:700;margin-top:12px;letter-spacing:2px;}
  .result .endline{font-family:var(--serif);font-size:16px;line-height:2.1;color:var(--ink);margin:20px auto 0;max-width:520px;text-align:justify;}
  .result .subnote{font-size:12px;color:var(--ink-faint);margin-top:16px;letter-spacing:1px;}

  .res-grid{display:flex;flex-direction:column;gap:16px;margin-top:26px;}
  .res-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;text-align:left;}
  .res-card .rt{font-size:13px;letter-spacing:2px;color:var(--ink-dim);margin-bottom:12px;}
  canvas{width:100%;max-width:300px;height:auto;margin:6px auto;display:block;}
  .res-btns{display:flex;flex-direction:column;gap:12px;margin-top:26px;}
  .share-tip{font-size:12px;color:var(--ink-faint);margin-top:16px;line-height:1.9;letter-spacing:.5px;}

  .navfoot{display:flex;gap:12px;margin-top:26px;}
  .navfoot .btn{flex:1;}

  @keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  .hidden{display:none !important;}

  @media (max-width:480px){
    .home h1{font-size:31px;letter-spacing:4px;}
    .scene h2{font-size:22px;}
    .scene .story{font-size:15px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- 顶部进度条 -->
  <div class="topbar hidden" id="topbar">
    <div class="toprow">
      <span class="chapno" id="chapno">第一章</span>
      <span id="chaptotal">共十章</span>
    </div>
    <div class="track"><div class="fill" id="fill"></div></div>
  </div>

  <main id="view"></main>

</div>

<script>
/* ============ 数据 ============ */
var SCENES=[
  {
    id:1,title:"社团招新",escort:"你想成为谁",
    text:"百团大战，你想加入哪里？",
    options:[
      {label:"报名学生会组织部",sub:"练人际，也练胆子",fate:{courage:1},set:{club:'stu'},

      {label:"报名志愿者协会",sub:"想去帮点什么",fate:{kind:1},set:{club:'vol'},

      {label:"什么都不想加入，转身离开",sub:"保留自己的节奏",fate:{study:1},set:{club:'none'},

  {

      {label:"递过去一张纸条",sub:"勇敢靠近",fate:{heart:1,courage:1},set:{love_note:true},
       line:"你把纸条推过去，心快跳出嗓子。命运，有时只是一次伸手。"},
      {label:"先成为朋友",sub:"慢慢守护",fate:{heart:1},set:{love_note:true},

  },
  {

    branch:function(mem){

      return {text:txt, options:[
        {label:"赴约，也把心意说出口",sub:"勇敢确认",fate:{heart:1},set:{love:true},line:"你应下了那个约。有些故事，从一句“好”开始。"},
        {label:"赴约，但先做朋友慢慢来",sub:"慢慢靠近",fate:{heart:1},set:{love:true},line:"你去了，没有说破。有些靠近，需要时间才敢承认。"},
        {label:"婉拒，把心思放回自己身上",sub:"克制",fate:{study:1},set:{love:false},line:"你回了句“下次吧”。心动有时候，也需要克制。"}
      ]};

  {

    ]
  },
  {
    id:5,title:"体测意外",escort:"一场突发的意外",

       line:"你喊了一声，有人朝你跑过来。原来开口求助，也是一种勇气。"},

       line:"你没惊动谁，自己坐到场边揉着伤。有些疼，你习惯先自己扛着。"}

  },
  {
    id:6,title:"人际裂缝",escort:"修复或放手",

      var love=mem.love;
      var txt=love?
        "你们之间出现了一道裂缝。" :
        "一段友情突然裂开了。";
      var optA={label:love?"主动低头，试着修复这段关系":"主动低头，试着修复这份友情",sub:"经营",fate:{heart:1},line:"你先开了口。放下姿态的那一刻，有些裂痕开始慢慢愈合。"};

        {label:"尊重各自的路，体面地说再见",sub:"成全放手",fate:{courage:1},line:"你放了手，没有拖泥带水。成全有时，是松开手让对方去更远的地方。"},

  }
];var ENDINGS={
  courage:{icon:"⇢",title:"孤勇者",sub:"勇气最高",color:"var(--c-courage)",

var S={idx:0, fate:{courage:0,heart:0,study:0,kind:0}, mem:{}, history:[]};

var chapno=document.getElementById("chapno");
var chaptotal=document.getElementById("chaptotal");

/* ============ 首页 ============ */
function renderHome(){
  topbar.classList.add("hidden");
  var h='<div class="home">'+
    '<div class="seal">大 一 至 大 四 · 命 运 之 旅</div>'+
    '<h1>命运的<span class="gold">岔路口</span></h1>'+
    '<div class="rule"></div>'+
    '<div class="sub" style="font-size:13px;color:var(--ink-faint);margin-top:18px;">每一个选择，都会累积你的四维命运——<br>勇气 · 情感 · 学力 · 善意。</div>'+
    '<div style="margin-top:34px;"><button class="btn btn-gold" onclick="startGame()">翻开命运之书</button></div>'+
  '</div>';
  view.innerHTML=h;
}

/* ============ 章节视图 ============ */
function renderScene(){
  topbar.classList.remove("hidden");
  var base=SCENES[S.idx];
  var scene=(typeof base.branch==='function')?base.branch(S.mem):base;
  var options=scene.options||base.options;
  fill.style.width=((S.idx+1)/(SCENES.length+1)*100)+"%";
  chapno.textContent="第"+CN(S.idx+1)+"章";
  chaptotal.textContent="共"+(SCENES.length+1)+"章";

  var opts="";
  for(var i=0;i<options.length;i++){
    var o=options[i];
    opts+='<button class="opt" onclick="choose('+i+')">'+
      '<span class="lab">'+o.label+'</span>'+
      '<span class="sub">'+o.sub+'</span>'+
    '</button>';
  }
  var h=
    '<div class="scene">'+
      '<div class="chapter">第'+CN(S.idx+1)+'章 · 第'+S.idx+'个路口</div>'+
      '<h2>'+(scene.title||base.title)+'</h2>'+
      '<div class="escort">'+(scene.escort||base.escort||'')+'</div>'+
      '<div class="story"><p>'+(scene.text||base.text||'')+'</p></div>'+
      '<div class="options">'+opts+'</div>'+
      navFootHTML()+
    '</div>';
  view.innerHTML=h;
  window.scrollTo({top:0,behavior:"smooth"});
}

function meterHTML(){
  var r="";
  for(var i=0;i<FATE.length;i++){
    var f=FATE[i];
    var v=S.fate[f.key]||0;
    r+='<div class="met-row">'+
      '<div class="met-name">'+f.name+'</div>'+
      '<div class="met-bar"><div class="met-fill" id="fill-'+f.key+'" style="width:'+(v*16)+'%;background:'+f.color+';"></div></div>'+
      '<div class="met-num" id="num-'+f.key+'">'+v+'</div>'+
    '</div>';
  }
  return r;
}

function navFootHTML(){
  var back=(S.idx>0)?'<button class="btn btn-ghost" onclick="backStep()">← 回到上一章重选</button>':'';
  var home='<button class="btn btn-ghost" onclick="toHome()">重新开始</button>';
  return '<div class="navfoot">'+back+home+'</div>';
}

var CNW=["一","二","三","四","五","六","七","八","九","十","十一","十二","十三"];
function CN(n){return CNW[n-1]||n;}

/* ============ 选择 ============ */
function choose(i){
  var base=SCENES[S.idx];
  var scene=(typeof base.branch==='function')?base.branch(S.mem):base;
  var o=(scene.options||base.options)[i];

  // 加命运值
  var gains=[];
  for(var k in o.fate){
    S.fate[k]+=o.fate[k];
    gains.push(FATE_CN[k]+"+"+o.fate[k]);
  }
  var memBefore=JSON.parse(JSON.stringify(S.mem));
  if(o.set){ for(var k in o.set){ S.mem[k]=o.set[k]; } }
  S.history.push({idx:S.idx, chose:i, memBefore:memBefore});

  // 刷新仪表
  updateMeter();

  // 渲染反馈
  var h=
    '<div class="scene">'+
      '<div class="chapter">命运的旁白</div>'+
      '<h2>'+(scene.title||base.title)+'</h2>'+
      '<div class="fatebox">'+
        '<div class="eyebrow">◆ 你选择 · '+o.label+'</div>'+
        '<div class="line">'+o.line+'</div>'+
        '<div style="margin-top:20px;"><button class="btn btn-gold" onclick="nextStep()">继续命运的旅程 →</button></div>'+
      '</div>'+
    '</div>';
  view.innerHTML=h;
  window.scrollTo({top:0,behavior:"smooth"});
}

function updateMeter(){
  for(var i=0;i<FATE.length;i++){
    var f=FATE[i],el=document.getElementById("fill-"+f.key),nm=document.getElementById("num-"+f.key);
    if(el){el.style.width=(S.fate[f.key]*16)+"%";}
    if(nm){nm.textContent=S.fate[f.key];}
  }
}

/* ============ 下一步 / 回退 ============ */
function nextStep(){
  if(S.idx+1 < SCENES.length){
    S.idx++;
    renderScene();
  }else{
    renderResult();
  }
}

function backStep(){
  if(S.idx<=0)return;
  var last=S.history.pop();
  if(last){
    var base=SCENES[last.idx];
    var scene=(typeof base.branch==='function')?base.branch(last.memBefore):base;
    var o=(scene.options||base.options)[last.chose];
    S.mem=JSON.parse(JSON.stringify(last.memBefore));
    for(var k in o.fate){S.fate[k]-=o.fate[k];}
  }
  S.idx--;
  renderScene();
  updateMeter();
}

function toHome(){reset();renderHome();}
function startGame(){reset();S.idx=0;renderScene();}
function reset(){S.idx=0;S.fate={courage:0,heart:0,study:0,kind:0};S.mem={};S.history=[];}

/* ============ 结局判定 ============ */
function judge(){
  var c=S.fate.courage,h=S.fate.heart,st=S.fate.study,k=S.fate.kind;
  var max=Math.max(c,h,st,k);
  var top=[];
  if(c===max)top.push("courage");
  if(h===max)top.push("heart");
  if(st===max)top.push("study");
  if(k===max)top.push("kind");
  if(top.length>=2)return "balance";
  return top[0];
}

/* ============ 结果页 ============ */
function renderResult(){
  topbar.classList.remove("hidden");
  fill.style.width="100%";
  chapno.textContent="终章";
  chaptotal.textContent="命运已定";
  var key=judge();
  var e=ENDINGS[key];
  var endText=e.text;
  if(key==='heart'){ endText = (S.mem.love?
    "你牵起了那个人的手。没有惊天动地，只有日复一日。后来你发现，最踏实的幸福，是你一路护着、也一直被你护着的那个人，一直都在。" :
    "你挽住了挚友与家人的手。没有惊天动地，只有日复一日。后来你发现，最踏实的幸福，是那些你一路护着、也一路护着你的人，都还在。"); }
  if(key==='kind'){ endText = (S.mem.volunteer?
    "你回了那年支教点的灯前，把那盏灯一直点亮了下去。后来山里的孩子长成了青年，他们说，曾有个哥哥（姐姐），让他们相信了远方。" :
    "你从一次次微小的帮助开始，把那点善意一点点传开。后来许多人记得你，不是因为你的成就，而是因为你愿意停下来、伸出手。"); }

  var h=
    '<div class="result">'+
      '<div class="badge">你的命运图谱</div>'+
      '<div class="icon" style="color:'+e.color+';">'+e.icon+'</div>'+
      '<h2>'+e.title+'</h2>'+
      '<div class="subnote">'+e.sub+'</div>'+
      '<div class="endline">'+endText+'</div>'+
      '<div class="res-grid">'+
        '<div class="res-card">'+
          '<div class="rt">四维命运雷达</div>'+
          '<canvas id="radar" width="300" height="300"></canvas>'+
        '</div>'+
        '<div class="res-card">'+
          '<div class="rt">四维命运值</div>'+
          '<div style="margin-top:6px;">'+meterHTML()+'</div>'+
        '</div>'+
      '</div>'+
      '<div class="res-btns">'+
        '<button class="btn btn-gold" onclick="toHome()">再来一次，重写命运</button>'+
        '<button class="btn btn-ghost" onclick="backStep()">← 回到上一章改一个选择</button>'+
      '</div>'+
    '</div>';
  view.innerHTML=h;
  drawRadar(key);
  window.scrollTo({top:0,behavior:"smooth"});
}

/* ============ 雷达图 ============ */
function drawRadar(key){
  var c=document.getElementById("radar");
  if(!c)return;
  var ctx=c.getContext("2d");
  var W=c.width,H=c.height,cx=W/2,cy=H/2,R=Math.min(W,H)/2-34;
  var dims=[["勇气",S.fate.courage,"#f0a35e"],["情感",S.fate.heart,"#e08a9d"],["学力",S.fate.study,"#7fb3e8"],["善意",S.fate.kind,"#8fd0a6"]];
  var n=dims.length,maxVal=Math.max(4, Math.max(S.fate.courage,S.fate.heart,S.fate.study,S.fate.kind),1);
  ctx.clearRect(0,0,W,H);

  function pt(i,r,off){
    var a=-Math.PI/2 + i*2*Math.PI/n + (off||0);
    return [cx+Math.cos(a)*r, cy+Math.sin(a)*r];
  }

  // 网格
  ctx.strokeStyle="rgba(236,229,212,0.12)";
  ctx.fillStyle="rgba(236,229,212,0.5)";
  ctx.lineWidth=1;
  for(var ring=1;ring<=4;ring++){
    var rr=R*ring/4;
    ctx.beginPath();
    for(var i=0;i<n;i++){
      var p=pt(i,rr);
      if(i===0)ctx.moveTo(p[0],p[1]);else ctx.lineTo(p[0],p[1]);
    }
    ctx.closePath();ctx.stroke();
  }
  // 轴线
  ctx.strokeStyle="rgba(236,229,212,0.14)";
  for(var i=0;i<n;i++){
    var p=pt(i,R);
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(p[0],p[1]);ctx.stroke();
  }
  // 数据面
  ctx.beginPath();
  for(var i=0;i<n;i++){
    var v=dims[i][1]/maxVal;
    var p=pt(i,R*v);
    if(i===0)ctx.moveTo(p[0],p[1]);else ctx.lineTo(p[0],p[1]);
  }
  ctx.closePath();
  ctx.fillStyle="rgba(217,164,65,0.20)";
  ctx.fill();
  ctx.strokeStyle="#d9a441";
  ctx.lineWidth=2;
  ctx.stroke();

  // 顶点
  for(var i=0;i<n;i++){
    var v=dims[i][1]/maxVal;
    var p=pt(i,R*v);
    ctx.beginPath();ctx.arc(p[0],p[1],4,0,Math.PI*2);
    ctx.fillStyle=dims[i][2];ctx.fill();
  }
  // 标签
  ctx.font="500 14px 'PingFang SC','Microsoft YaHei',sans-serif";
  ctx.textAlign="center";ctx.textBaseline="middle";
  for(var i=0;i<n;i++){
    var p=pt(i,R+22);
    ctx.fillStyle=dims[i][2];
    ctx.fillText(dims[i][0],p[0],p[1]);
  }
}

/* ============ 启动 ============ */
renderHome();
</script>
</body>
</html>
